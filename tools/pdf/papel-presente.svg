    <g fill="#e3cb95" stroke="none"><circle cx="92" cy="86" r="1.6"/><circle cx="208" cy="22" r="1.4"/><circle cx="30" cy="16" r="1.2"/><circle cx="222" cy="206" r="1.6"/><circle cx="100" cy="186" r="1.3"/><circle cx="160" cy="98" r="1.1"/></g>
