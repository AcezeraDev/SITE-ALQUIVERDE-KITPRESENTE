      <path d="M0 0C6-4 8-12 14-9 15-4 19-3 23-10 25-5 29-3 34-10 35-4 39-1 46-1 39 1 35 4 34 10 29 3 25 5 23 10 19 3 15 4 14 9 8 12 6 4 0 0Z" transform="rotate(204)"/>
