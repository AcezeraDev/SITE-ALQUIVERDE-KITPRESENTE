      <rect x="-21" y="-17" width="42" height="9" rx="1.5"/>
      <path d="M0-17V20"/>
      <path d="M0-17c-5-11-17-12-15-4 1 4 9 5 15 4Zm0 0c5-11 17-12 15-4-1 4-9 5-15 4Z"/>
    </g>
    <g id="star"><path d="M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z" fill="#e3cb95" stroke="none"/></g>
